version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ingestion
      POSTGRES_PASSWORD: ingestion
      POSTGRES_DB: ingestion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingestion -d ingestion"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://ingestion:ingestion@db:5432/ingestion
      SOURCES_DIR: sources
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      NASA_API_KEY: ${NASA_API_KEY:-DEMO_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./sources:/app/sources

volumes:
  pgdata:
